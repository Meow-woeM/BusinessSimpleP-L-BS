name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pywebview pyinstaller

      - name: Run tests
        run: pip install pytest && python -m pytest -q

      - name: Build SimplePL.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SimplePL
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "apps_script.gs;."
          desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePL-windows
          path: dist/SimplePL.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimplePL.exe
