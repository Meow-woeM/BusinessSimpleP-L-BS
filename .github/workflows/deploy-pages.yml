name: Deploy web app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/income-expenses-tracker-2pupxa

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ledger parity tests
        run: node webapp/ledger.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
