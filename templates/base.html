<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simple P&amp;L{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap">
      <span class="brand">Simple P&amp;L</span>
      <nav>
        <a href="{{ url_for('transactions') }}" {% if request.endpoint in ('transactions', 'edit_transaction') %}class="active"{% endif %}>Transactions</a>
        <a href="{{ url_for('pnl') }}" {% if request.endpoint == 'pnl' %}class="active"{% endif %}>Profit &amp; Loss</a>
        <a href="{{ url_for('balance_sheet') }}" {% if request.endpoint == 'balance_sheet' %}class="active"{% endif %}>Balance Sheet</a>
        <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}class="active"{% endif %}>Settings</a>
      </nav>
      {% if config.get('SHUTDOWN_EVENT') %}
      <form method="post" action="{{ url_for('quit_app') }}" class="quit-form"
            onsubmit="return confirm('Close Simple P&L? Your data is saved automatically.');">
        <button type="submit" class="link-button">Quit</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
